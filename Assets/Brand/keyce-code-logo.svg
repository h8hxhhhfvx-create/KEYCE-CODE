<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">KEYCE CODE</title>
  <desc id="desc">Logo de KEYCE CODE, un éditeur de code moderne.</desc>
  <defs>
    <linearGradient id="markGradient" x1="24" y1="18" x2="190" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="252" y1="62" x2="662" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblème : fenêtre d’éditeur + chevrons + K stylisé -->
  <g filter="url(#softGlow)">
    <rect x="18" y="18" width="184" height="184" rx="42" fill="#171A22" stroke="url(#markGradient)" stroke-width="6"/>
    <path d="M18 68h184" stroke="#2B3140" stroke-width="5"/>
    <circle cx="49" cy="43" r="6" fill="#22D3EE"/>
    <circle cx="70" cy="43" r="6" fill="#3B82F6"/>
    <circle cx="91" cy="43" r="6" fill="#8B5CF6"/>
    <path d="M69 108 43 130l26 22" fill="none" stroke="#67E8F9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m151 108 26 22-26 22" fill="none" stroke="#A78BFA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m121 99-18 62" fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Nom de marque -->
  <g font-family="Segoe UI, Arial, sans-serif" fill="url(#wordGradient)">
    <text x="242" y="111" font-size="62" font-weight="700" letter-spacing="6">KEYCE</text>
    <text x="247" y="164" font-size="43" font-weight="500" letter-spacing="10" fill="#67E8F9">CODE</text>
  </g>
  <path d="M250 181h390" stroke="url(#markGradient)" stroke-width="4" stroke-linecap="round" opacity=".85"/>
</svg>
